<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Stability Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Test the same CSS fixes */
        .modal {
            z-index: 1055 !important;
            animation: none !important;
            transition: none !important;
        }
        
        .modal-backdrop {
            z-index: 1050 !important;
            animation: none !important;
            transition: none !important;
        }
        
        .modal * {
            transition: none !important;
            animation: none !important;
            transform: none !important;
        }
        
        * {
            animation: none !important;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Modal Stability Test</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#testModal">
            Open Test Modal
        </button>
    </div>

    <!-- Test Modal -->
    <div class="modal fade" id="testModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Test Modal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>This modal should stay stable when you hover over it.</p>
                    <p>Try moving your mouse around the modal - it should not glitch or move.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Test the same JavaScript fixes
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('testModal');
            
            modal.addEventListener('show.bs.modal', function() {
                console.log('Modal opening - hover effects disabled');
            });
            
            modal.addEventListener('hidden.bs.modal', function() {
                console.log('Modal closed - hover effects enabled');
            });
        });
    </script>
</body>
</html>
